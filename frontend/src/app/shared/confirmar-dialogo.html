<dialog
  #dlg
  role="alertdialog"
  aria-labelledby="titulo-confirmar"
  aria-describedby="mensaje-confirmar"
  (close)="alCerrar()"
  (keydown)="atraparTabulacion($event)">
  <h3 id="titulo-confirmar">{{ titulo() }}</h3>
  <p id="mensaje-confirmar">{{ mensaje() }}</p>
  <div class="acciones-dialogo">
    <button type="button" (click)="cancelar()">Cancelar</button>
    <button type="button" class="btn-peligro" (click)="confirmar()">{{ textoConfirmar() }}</button>
  </div>
</dialog>
