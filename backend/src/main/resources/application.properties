# Fase 1 — Conexión PostgreSQL 16 + TZ estricta America/Argentina/Mendoza
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/gimnasio?options=-c%20TimeZone%3DAmerica/Argentina/Mendoza
spring.datasource.username=gimnasio
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Mendoza
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# JWT stateless (F1-T4). En producción definir JWT_SECRETO (>=32 caracteres) por entorno.
app.jwt.secreto=${JWT_SECRETO:cambiar-en-produccion-minimo-32-caracteres-123456}
app.jwt.expiracion-ms=3600000

# JVM hereda TZ; reforzar arranque con -Duser.timezone=America/Argentina/Mendoza
